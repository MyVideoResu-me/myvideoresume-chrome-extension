name: Chrome Extension Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      # Per-target tags. Push `chrome-ext-app-v4.1.0` to release the unified
      # hired.video extension — it ships as the next version of the EXISTING
      # job-seeker Chrome Web Store item (CHROME_EXTENSION_ID_JOBSEEKER), so
      # current users upgrade in place. `chrome-ext-recruiter-v1.2.3` still
      # releases the legacy recruiter item until it is retired.
      - 'chrome-ext-app-v*.*.*'
      - 'chrome-ext-recruiter-v*.*.*'
  workflow_dispatch:
    inputs:
      target:
        description: Which extension to publish (app / recruiter)
        required: true
        default: app
        type: choice
        options:
          - app
          - recruiter
      publish:
        description: Upload package to Chrome Web Store
        required: false
        default: false
        type: boolean
      submit_for_review:
        description: Submit uploaded package for review/publish
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build Extension Packages
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.versions.outputs.app_version }}
      recruiter_version: ${{ steps.versions.outputs.recruiter_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Validate manifests and read versions
        id: versions
        run: |
          for target in app recruiter; do
            MANIFEST_PATH="${target}/manifest.json"
            jq empty "$MANIFEST_PATH"
            jq -e '.manifest_version' "$MANIFEST_PATH" >/dev/null
            jq -e '.name' "$MANIFEST_PATH" >/dev/null
            jq -e '.version' "$MANIFEST_PATH" >/dev/null
            VERSION=$(jq -r '.version' "$MANIFEST_PATH")
            echo "${target}_version=$VERSION" >> "$GITHUB_OUTPUT"
          done

      - name: Typecheck the unified app
        run: npm run typecheck

      - name: Build packages
        # `release.js` runs the Node build pipeline for each target and
        # produces `dist/<target>.zip` with manifest.json at the ZIP root.
        run: node scripts/release.js --build

      - name: Unit tests
        run: npm test

      - name: Verify packages exist
        run: |
          ls -la dist/app.zip
          ls -la dist/recruiter.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-app-${{ steps.versions.outputs.app_version }}-${{ github.sha }}
          path: dist/app.zip
          retention-days: 30

      - name: Upload recruiter artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-recruiter-${{ steps.versions.outputs.recruiter_version }}-${{ github.sha }}
          path: dist/recruiter.zip
          retention-days: 30

  release:
    name: Create GitHub Release Asset
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/chrome-ext-app-v') || startsWith(github.ref, 'refs/tags/chrome-ext-recruiter-v')

    steps:
      - name: Determine target from tag
        id: target
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/chrome-ext-app-v* ]]; then
            echo "name=app" >> "$GITHUB_OUTPUT"
            echo "version=${{ needs.build.outputs.app_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=recruiter" >> "$GITHUB_OUTPUT"
            echo "version=${{ needs.build.outputs.recruiter_version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension-${{ steps.target.outputs.name }}-${{ steps.target.outputs.version }}-${{ github.sha }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.target.outputs.name }}.zip
          generate_release_notes: true

  # The unified app publishes to the EXISTING job-seeker store item, so
  # every current install upgrades to it in place (owner decision 2026-10-16).
  publish-app:
    name: Publish hired.video (app) to the job-seeker Chrome Web Store item
    runs-on: ubuntu-latest
    needs: build
    if: |
      startsWith(github.ref, 'refs/tags/chrome-ext-app-v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' && github.event.inputs.target == 'app')

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension-app-${{ needs.build.outputs.app_version }}-${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chrome Web Store CLI
        run: npm install -g chrome-webstore-upload-cli

      - name: Upload package to Chrome Web Store
        run: |
          chrome-webstore-upload upload \
            --source app.zip \
            --extension-id "${{ secrets.CHROME_EXTENSION_ID_JOBSEEKER }}" \
            --client-id "${{ secrets.CHROME_CLIENT_ID }}" \
            --client-secret "${{ secrets.CHROME_CLIENT_SECRET }}" \
            --refresh-token "${{ secrets.CHROME_REFRESH_TOKEN }}"

      - name: Publish package in Chrome Web Store
        if: |
          startsWith(github.ref, 'refs/tags/chrome-ext-app-v') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.submit_for_review == 'true')
        run: |
          chrome-webstore-upload publish \
            --extension-id "${{ secrets.CHROME_EXTENSION_ID_JOBSEEKER }}" \
            --client-id "${{ secrets.CHROME_CLIENT_ID }}" \
            --client-secret "${{ secrets.CHROME_CLIENT_SECRET }}" \
            --refresh-token "${{ secrets.CHROME_REFRESH_TOKEN }}"

  publish-recruiter:
    name: Publish recruiter to Chrome Web Store
    runs-on: ubuntu-latest
    needs: build
    if: |
      startsWith(github.ref, 'refs/tags/chrome-ext-recruiter-v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' && github.event.inputs.target == 'recruiter')

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension-recruiter-${{ needs.build.outputs.recruiter_version }}-${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chrome Web Store CLI
        run: npm install -g chrome-webstore-upload-cli

      - name: Upload package to Chrome Web Store
        run: |
          chrome-webstore-upload upload \
            --source recruiter.zip \
            --extension-id "${{ secrets.CHROME_EXTENSION_ID_RECRUITER }}" \
            --client-id "${{ secrets.CHROME_CLIENT_ID }}" \
            --client-secret "${{ secrets.CHROME_CLIENT_SECRET }}" \
            --refresh-token "${{ secrets.CHROME_REFRESH_TOKEN }}"

      - name: Publish package in Chrome Web Store
        if: |
          startsWith(github.ref, 'refs/tags/chrome-ext-recruiter-v') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.submit_for_review == 'true')
        run: |
          chrome-webstore-upload publish \
            --extension-id "${{ secrets.CHROME_EXTENSION_ID_RECRUITER }}" \
            --client-id "${{ secrets.CHROME_CLIENT_ID }}" \
            --client-secret "${{ secrets.CHROME_CLIENT_SECRET }}" \
            --refresh-token "${{ secrets.CHROME_REFRESH_TOKEN }}"
