name: Chrome Extension Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      # Per-target tags. Push `chrome-ext-jobseeker-v1.2.3` to release
      # the job-seeker build; `chrome-ext-recruiter-v1.2.3` for recruiter.
      # Legacy `chrome-ext-v*` tag still triggers the build job but no
      # longer publishes — the secrets are split per target now (#633).
      - 'chrome-ext-jobseeker-v*.*.*'
      - 'chrome-ext-recruiter-v*.*.*'
  workflow_dispatch:
    inputs:
      target:
        description: Which extension to publish (jobseeker / recruiter)
        required: true
        default: jobseeker
        type: choice
        options:
          - jobseeker
          - recruiter
      publish:
        description: Upload package to Chrome Web Store
        required: false
        default: false
        type: boolean
      submit_for_review:
        description: Submit uploaded package for review/publish
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build Extension Packages
    runs-on: ubuntu-latest
    outputs:
      jobseeker_version: ${{ steps.versions.outputs.jobseeker_version }}
      recruiter_version: ${{ steps.versions.outputs.recruiter_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Validate manifests and read versions
        id: versions
        run: |
          for target in jobseeker recruiter; do
            MANIFEST_PATH="${target}/manifest.json"
            jq empty "$MANIFEST_PATH"
            jq -e '.manifest_version' "$MANIFEST_PATH" >/dev/null
            jq -e '.name' "$MANIFEST_PATH" >/dev/null
            jq -e '.version' "$MANIFEST_PATH" >/dev/null
            VERSION=$(jq -r '.version' "$MANIFEST_PATH")
            echo "${target}_version=$VERSION" >> "$GITHUB_OUTPUT"
          done

      - name: Build packages
        # `release.js` runs the Node build pipeline for each target and
        # produces `dist/<target>.zip` with manifest.json at the ZIP root.
        run: node scripts/release.js --build

      - name: Verify packages exist
        run: |
          ls -la dist/jobseeker.zip
          ls -la dist/recruiter.zip

      - name: Upload jobseeker artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-jobseeker-${{ steps.versions.outputs.jobseeker_version }}-${{ github.sha }}
          path: dist/jobseeker.zip
          retention-days: 30

      - name: Upload recruiter artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-recruiter-${{ steps.versions.outputs.recruiter_version }}-${{ github.sha }}
          path: dist/recruiter.zip
          retention-days: 30

  release:
    name: Create GitHub Release Asset
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/chrome-ext-jobseeker-v') || startsWith(github.ref, 'refs/tags/chrome-ext-recruiter-v')

    steps:
      - name: Determine target from tag
        id: target
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/chrome-ext-jobseeker-v* ]]; then
            echo "name=jobseeker" >> "$GITHUB_OUTPUT"
            echo "version=${{ needs.build.outputs.jobseeker_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=recruiter" >> "$GITHUB_OUTPUT"
            echo "version=${{ needs.build.outputs.recruiter_version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension-${{ steps.target.outputs.name }}-${{ steps.target.outputs.version }}-${{ github.sha }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.target.outputs.name }}.zip
          generate_release_notes: true

  publish-jobseeker:
    name: Publish jobseeker to Chrome Web Store
    runs-on: ubuntu-latest
    needs: build
    if: |
      startsWith(github.ref, 'refs/tags/chrome-ext-jobseeker-v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' && github.event.inputs.target == 'jobseeker')

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension-jobseeker-${{ needs.build.outputs.jobseeker_version }}-${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chrome Web Store CLI
        run: npm install -g chrome-webstore-upload-cli

      - name: Upload package to Chrome Web Store
        run: |
          chrome-webstore-upload upload \
            --source jobseeker.zip \
            --extension-id "${{ secrets.CHROME_EXTENSION_ID_JOBSEEKER }}" \
            --client-id "${{ secrets.CHROME_CLIENT_ID }}" \
            --client-secret "${{ secrets.CHROME_CLIENT_SECRET }}" \
            --refresh-token "${{ secrets.CHROME_REFRESH_TOKEN }}"

      - name: Publish package in Chrome Web Store
        if: |
          startsWith(github.ref, 'refs/tags/chrome-ext-jobseeker-v') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.submit_for_review == 'true')
        run: |
          chrome-webstore-upload publish \
            --extension-id "${{ secrets.CHROME_EXTENSION_ID_JOBSEEKER }}" \
            --client-id "${{ secrets.CHROME_CLIENT_ID }}" \
            --client-secret "${{ secrets.CHROME_CLIENT_SECRET }}" \
            --refresh-token "${{ secrets.CHROME_REFRESH_TOKEN }}"

  publish-recruiter:
    name: Publish recruiter to Chrome Web Store
    runs-on: ubuntu-latest
    needs: build
    if: |
      startsWith(github.ref, 'refs/tags/chrome-ext-recruiter-v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' && github.event.inputs.target == 'recruiter')

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension-recruiter-${{ needs.build.outputs.recruiter_version }}-${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chrome Web Store CLI
        run: npm install -g chrome-webstore-upload-cli

      - name: Upload package to Chrome Web Store
        run: |
          chrome-webstore-upload upload \
            --source recruiter.zip \
            --extension-id "${{ secrets.CHROME_EXTENSION_ID_RECRUITER }}" \
            --client-id "${{ secrets.CHROME_CLIENT_ID }}" \
            --client-secret "${{ secrets.CHROME_CLIENT_SECRET }}" \
            --refresh-token "${{ secrets.CHROME_REFRESH_TOKEN }}"

      - name: Publish package in Chrome Web Store
        if: |
          startsWith(github.ref, 'refs/tags/chrome-ext-recruiter-v') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.submit_for_review == 'true')
        run: |
          chrome-webstore-upload publish \
            --extension-id "${{ secrets.CHROME_EXTENSION_ID_RECRUITER }}" \
            --client-id "${{ secrets.CHROME_CLIENT_ID }}" \
            --client-secret "${{ secrets.CHROME_CLIENT_SECRET }}" \
            --refresh-token "${{ secrets.CHROME_REFRESH_TOKEN }}"
